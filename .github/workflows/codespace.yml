name: codespace

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the Codespace container and prove it works
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: bash .devcontainer/smoke.sh
